<app-nav-bar></app-nav-bar>

<main>
  <p-toast />
  <section class="container-center --0">
    <app-calendar
      #startDate
      [informationLabel]="'Fecha Inicial'">
    </app-calendar>
    <app-calendar
      #endDate
      [informationLabel]="'Fecha Final'">
    </app-calendar>
    <app-action-button
      [iconClass]="'icon-1'"
      [informationLabel]="'Filtrar'"
      (buttonClick)="configureMessages()">
    </app-action-button>
  </section>

  <section>
    <div class="container-center">
      <app-tag
        [informationLabel]="'TOTAL GENERAL DE CASOS ATENDIDOS'"
        class="casesAttended">
      </app-tag>
    </div>
    <div class="typography-title container-center2">
      <div>
        <div class="color-bold">
          Llamadas<br>Atendidas
        </div>
          {{ llamadasAtendidas }}
      </div>
      <div>
        <div class="color-bold">
          Mensajes<br>Whatsapp<br>Atendidos
        </div>
          {{ mensajesWhatsappAtendidos }}
      </div>
      <div>
        <div class="color-bold">
          Total Casos<br>Registrados
        </div>
          {{ totalCasosRegistrados }}
      </div>
    </div>
  </section>

  <section>
    <div class="container-center --1">
      <div>
        <app-tag
          [informationLabel]="'POR TIPO DE CASO'"
          class="size1">
        </app-tag>
        <p-chart
          type="bar"
          class="graphicSize"
          [data]="typecaseData"
          [options]="typecaseOptions"
        />
      </div>
      <div>
        <app-tag
          [informationLabel]="'POR TIPO ATENCION'"
          class="size2">
        </app-tag>
        <p-chart
          type="pie"
          class="graphicSize"
          [data]="typeattentionData"
          [options]="typeattentionOptions"
        />
      </div>
    </div>
  </section>

  <section>
    <div class="container-center">
      <div>
        <app-tag
          [informationLabel]="'REGISTRADAS DE ACUERDO A OPERADOR'"
          class="size3">
        </app-tag>
        <p-chart
          type="bar"
          class="graphicSize2"
          [data]="registeredoperatorData"
          [options]="registeredoperatorOptions"
        />
      </div>
    </div>
  </section>

  <section>
    <div class="container-center">
      <div>
        <app-tag
          [informationLabel]="'REGISTRADAS POR UNIDAD'"
          class="size4">
        </app-tag>
        <p-chart
          type="bar"
          class="graphicSize2"
          [data]="registeredunitData"
          [options]="registeredunitOptions"
        />
      </div>
    </div>
  </section>

  <section>
    <div class="container-center">
      <div>
        <app-tag
          [informationLabel]="'POR PERSONA'"
          class="size5">
        </app-tag>
        <p-chart
          type="bar"
          class="graphicSize2"
          [data]="perpersonData"
          [options]="perpersonOptions"
        />
      </div>
    </div>
  </section>

  <section>
    <div class="container-center --1">
      <div>
        <app-tag
          [informationLabel]="'POR ESTADO DE CASO'"
          class="size2">
        </app-tag>
        <p-chart
          type="pie"
          class="graphicSize"
          [data]="statuscaseData"
          [options]="statuscaseOptions"
        />
      </div>
      <div>
        <app-tag
          [informationLabel]="'LLAMADAS REGISTRADAS DE ACUERDO AL OPERADOR'"
          class="size1">
        </app-tag>
        <p-chart
          type="bar"
          class="graphicSize2"
          [data]="callsoperatorData"
          [options]="callsoperatorOptions"
        />
      </div>
    </div>
  </section>
</main>

<app-footer></app-footer>
